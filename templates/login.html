{% extends "base.html" %}
{% block title %}Sign in — Ghostlayer{% endblock %}

{% block content %}
<div class="auth-card panel">
  <h1>Sign in</h1>
  <p class="muted" style="font-size:0.86rem">Your scan history and API key live here.</p>

  <form method="post" class="mt-2">
    <div class="field">
      <label for="email">Email</label>
      <input type="email" name="email" id="email" value="{{ email }}" required autocomplete="email" autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" name="password" id="password" required autocomplete="current-password">
    </div>
    <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
    <button class="btn" type="submit" style="width:100%">Sign in</button>
  </form>

  <p class="swap">
    No account yet? <a href="{{ url_for('auth.register') }}">Create one</a> — it takes a form and a password.
  </p>
</div>
{% endblock %}
